<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="72%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#232336"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Field stars — very dim, scattered, non-uniform -->
  <g fill="#45475a">
    <circle cx="148" cy="184" r="1.2"/>
    <circle cx="832" cy="108" r="0.9"/>
    <circle cx="912" cy="668" r="1.4"/>
    <circle cx="174" cy="852" r="1"/>
    <circle cx="764" cy="888" r="1.2"/>
    <circle cx="82"  cy="524" r="0.8"/>
    <circle cx="964" cy="412" r="1.3"/>
    <circle cx="388" cy="96"  r="0.9"/>
    <circle cx="224" cy="420" r="1.1"/>
    <circle cx="884" cy="268" r="0.8"/>
    <circle cx="572" cy="940" r="1.2"/>
    <circle cx="104" cy="668" r="0.9"/>
    <circle cx="656" cy="148" r="1"/>
    <circle cx="940" cy="820" r="1.3"/>
    <circle cx="292" cy="764" r="0.8"/>
    <circle cx="748" cy="596" r="1"/>
    <circle cx="188" cy="268" r="1.2"/>
    <circle cx="544" cy="60"  r="0.9"/>
  </g>

  <!-- Constellation lines: ν → α → β -->
  <g stroke="#fab387" stroke-linecap="round" stroke-linejoin="round">
    <!-- ν to α -->
    <line x1="308" y1="296" x2="704" y2="468" stroke-width="1.8" opacity="0.38"/>
    <!-- α to β -->
    <line x1="704" y1="468" x2="472" y2="692" stroke-width="1.8" opacity="0.38"/>
  </g>

  <!-- ν Fornacis — faintest -->
  <!-- soft halo -->
  <circle cx="308" cy="296" r="18" fill="#fab387" opacity="0.08"/>
  <circle cx="308" cy="296" r="9"  fill="#fab387" opacity="0.22"/>
  <!-- core -->
  <circle cx="308" cy="296" r="4.5" fill="#fab387"/>
  <circle cx="308" cy="296" r="2"   fill="#fef3e8"/>

  <!-- β Fornacis — medium -->
  <circle cx="472" cy="692" r="24" fill="#fab387" opacity="0.08"/>
  <circle cx="472" cy="692" r="12" fill="#fab387" opacity="0.22"/>
  <circle cx="472" cy="692" r="6"  fill="#fab387"/>
  <circle cx="472" cy="692" r="2.8" fill="#fef0e4"/>

  <!-- α Fornacis — brightest -->
  <circle cx="704" cy="468" r="40" fill="#fab387" opacity="0.07"/>
  <circle cx="704" cy="468" r="22" fill="#fab387" opacity="0.16"/>
  <circle cx="704" cy="468" r="12" fill="#fab387" opacity="0.5"/>
  <circle cx="704" cy="468" r="8"  fill="#fab387"/>
  <circle cx="704" cy="468" r="3.5" fill="#fff6ed"/>

  <!-- Greek labels — faint, mono, very small -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="22" fill="#6c7086" opacity="0.7">
    <text x="320" y="282">ν</text>
    <text x="716" y="460">α</text>
    <text x="484" y="718">β</text>
  </g>
</svg>
