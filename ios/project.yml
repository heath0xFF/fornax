name: FornaxMobile
options:
  bundleIdPrefix: sh.steppe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""   # fill in your Team ID from Xcode / developer.apple.com

targets:
  FornaxMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FornaxMobile
    info:
      path: FornaxMobile/Info.plist
      properties:
        CFBundleDisplayName: Fornax
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # needed for http:// tailnet endpoints
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.steppe.fornax-mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
